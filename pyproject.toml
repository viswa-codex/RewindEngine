[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrotrace"
version = "0.1.0"
description = "RetroTrace – execution tracing and replay engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
retrotrace = "retrotrace.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["retrotrace*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
